name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync

    - name: Ruff linter
      run: uv run ruff check .

    - name: Ruff formatter
      run: uv run ruff format --check --diff .

  test:
    # Отдельная проверка на каждую тему: в PR видно, какая тема прошла, а какая нет.
    # Сдаёшь тему — смотри на её строку, нерешённые темы будут красными, это нормально.
    name: test (${{ matrix.topic }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topic:
          - 1_strings
          - 2_dicts
          - 3_functions
          - 4_decorators
          - 5_iterators
          - 6_classes

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync

    - name: Run tests for ${{ matrix.topic }}
      run: uv run pytest -v ${{ matrix.topic }}/
